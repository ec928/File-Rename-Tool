name: Bug report
description: A rename did the wrong thing, or the tool failed to run
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** paste your `FileRenameWPF_Log.csv` directly — it contains the full paths of
        your files. Retype a couple of example filenames instead, or edit the paths out first.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect the rename to produce, and what did it produce instead?
      placeholder: 'With Replace on "IMG_" I expected "holiday_001.jpg" but got "holiday001.jpg".'
    validations:
      required: true

  - type: dropdown
    id: rule
    attributes:
      label: Which rename rule?
      options:
        - Insert at Position
        - Insert by Separator
        - Remove
        - Replace With
        - Date Modified
        - Not applicable (tool wouldn't start)
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example filenames
      description: Two or three original names, and what you expected each to become. Made-up examples are fine.
      value: |
        Original            -> Expected           -> Actual
        example-file-01.jpg -> example-01.jpg     -> exampl-01.jpg
    validations:
      required: true

  - type: input
    id: psversion
    attributes:
      label: PowerShell version
      description: Run `$PSVersionTable.PSVersion` in PowerShell and paste the result.
      placeholder: e.g. 5.1.26100.1
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, type `winver`, and paste what it shows.
      placeholder: e.g. Windows 11 Pro 24H2 (build 26100.1742)
    validations:
      required: true

  - type: checkboxes
    id: undo
    attributes:
      label: Recovery
      options:
        - label: I tried Undo and it did not restore the original names
